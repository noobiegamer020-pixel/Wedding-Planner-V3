const H=t=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return 4294967296*(2097151&b)+(a>>>0)};

const cfgOK=()=>{const c=window.FIREBASE_CONFIG;return!!(c&&c.apiKey&&!/^PASTE/.test(c.apiKey))};
async function fbInit(){
  if(FB!==null&&FB!==false)return FB;FBMSG="";
  if(!cfgOK())return FB=false;
  const ld=src=>new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
  if(!window.firebase)for(const b of["","https://www.gstatic.com/firebasejs/10.14.1/"]){try{await ld(b+"firebase-app-compat.js");await ld(b+"firebase-firestore-compat.js");break}catch(e){}}
  if(!window.firebase){FBMSG="Could not load the sync library. Check your internet connection.";return FB=false}
  try{firebase.initializeApp(window.FIREBASE_CONFIG);const f=firebase.firestore();try{f.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}try{await f.enablePersistence({synchronizeTabs:true})}catch(e){}FB=f}catch(e){FBMSG="Firebase error: "+(e.code||e.message||e);FB=false}
  return FB;
}
function flat(){
  fix();const m={};
  state.goals.forEach(g=>{const{items,...gm}=g;m["g_"+g.id]=JSON.stringify(gm);items.forEach(i=>{m["i_"+i.id]=JSON.stringify({...i,g:g.id})})});
  state.log.forEach(l=>m["l_"+l.id]=JSON.stringify(l));state.loans.forEach(l=>m["n_"+l.id]=JSON.stringify(l));
  const c=state.cfg;m.c_cfg=JSON.stringify({a:c.a,b:c.b,date:c.date,msg:c.msg,theme:c.theme,si:c.si,sh:c.sh});return m;
}
function unflat(m){
  const gs={},its=[],lg=[],ln=[];let cf={};
  for(const[k,v]of Object.entries(m)){let o;try{o=JSON.parse(v)}catch(e){continue}
    if(k.startsWith("g_"))gs[o.id]={...o,items:[]};else if(k.startsWith("i_"))its.push(o);else if(k.startsWith("l_"))lg.push(o);else if(k.startsWith("n_"))ln.push(o);else if(k==="c_cfg")cf=o}
  const by=(a,b)=>(a.c||0)-(b.c||0);
  its.sort(by).forEach(i=>{const g=gs[i.g];if(g){delete i.g;g.items.push(i)}});
  return{goals:Object.values(gs).sort(by),log:lg.sort(by),loans:ln.sort(by),cfg:Object.assign(CFG(),state.cfg,cf)};
}

async function push(){
  if(!SY.code||!REF)return;
  const cur=flat(),up={},old={};let u=Math.max(Date.now(),SY.lu+1);
  for(const k in cur)if(H(cur[k])!==SY.sent[k]){up[k]={d:cur[k],u:u++,by:SY.role};old[k]=SY.sent[k]}
  for(const k in SY.sent)if(!(k in cur)){up[k]={del:1,u:u++,by:SY.role};old[k]=SY.sent[k]}
  if(!Object.keys(up).length)return;
  SY.lu=u;
  for(const k in up){SY.ts[k]=up[k].u;if(up[k].del)delete SY.sent[k];else SY.sent[k]=H(cur[k])}
  saveSY();
  try{await REF.set(up,{merge:true});setSt("live")}
  catch(e){for(const k in old){if(old[k]===undefined)delete SY.sent[k];else SY.sent[k]=old[k]}saveSY();setSt("err")}
}
function applyRemote(data){
  const cur=flat(),fresh=[];let ch=0,seen=SY.seen;
  for(const[k,f]of Object.entries(data)){
    if(!f||typeof f!=="object"||!f.u)continue;seen=Math.max(seen,f.u);
    if(f.u<=(SY.ts[k]||0))continue;
    SY.ts[k]=f.u;
    if(f.del){if(k in cur){delete cur[k];ch=1}delete SY.sent[k];continue}
    if(f.d===cur[k]){SY.sent[k]=H(f.d);continue}
    const isNew=!(k in cur);cur[k]=f.d;SY.sent[k]=H(f.d);ch=1;
    if(isNew&&f.by&&f.by!==SY.role&&f.u>SY.seen)fresh.push([k,f.d]);
  }
  if(ch){state=unflat(cur);fix();try{store()}catch(e){}render()}
  SY.seen=seen;saveSY();
  if(fresh.length)notifyNew(fresh);
}
